<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Bank assistant</title>
    </head>
    <body>
    <h1>Bank assistant</h1>
    <ul id="messages"></ul>
    <form id="chat">
        <input id="box" type="text" autocomplete="off" placeholder="Type a message">
        <button type="submit">Send</button>
    </form>
    <script>
        // This list is the whole memory of the chat. A refresh clears it.
        const messages = [];
        const list = document.querySelector("#messages");
        const form = document.querySelector("#chat");
        const box = document.querySelector("#box");
        const button = form.querySelector("button");

        function addLine(text) {
        const item = document.createElement("li");
        item.textContent = text;
        list.appendChild(item);
        }

        form.addEventListener("submit", async (event) => {
        event.preventDefault(); // Stay on this page. The form must not do a normal reload.
        const text = box.value.trim();
        if (!text) return;

        messages.push({ role: "user", content: text });
        addLine("You: " + text);
        box.value = "";
        button.disabled = true;

        try {
            const response = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ messages }),
            });
            const body = await response.json();
            if (!response.ok) {
            // 400 and 503 put the reason in detail. Show it. Do not add it to messages,
            // or the next send would include an error as if the assistant had said it.
            addLine("Error: " + (body.detail || "Request failed."));
            messages.pop();
            return;
            }
            messages.push({ role: "assistant", content: body.reply });
            addLine("Assistant: " + body.reply);
        } catch (error) {
            addLine("Error: Could not reach the API.");
            messages.pop();
        } finally {
            button.disabled = false;
            box.focus();
        }
        });
    </script>
    </body>
</html>
